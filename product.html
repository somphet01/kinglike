<!doctype html>
<html lang="lo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinglike Product</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="product-page">
    <header class="site-header" data-header>
      <button class="menu-btn" type="button" data-open-menu aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a class="brand" href="index.html#home" aria-label="Kinglike home">
        <img src="assets/kinglike-logo-tight.png" alt="Kinglike" />
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html#home">ໜ້າຫຼັກ</a>
        <a href="index.html#products">ທີ່ນອນ</a>
        <a href="collection.html?category=pillows">ໝອນ</a>
        <a href="collection.html?category=toppers">ທັອບເປີ</a>
        <a href="index.html#promotion">ໂປຣໂມຊັນ</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" type="button" data-open-wishlist aria-label="Wishlist">
          <span>♡</span><small data-wishlist-count>0</small>
        </button>
        <button class="icon-btn" type="button" data-open-cart aria-label="Cart">
          <span>🛒</span><small data-cart-count>0</small>
        </button>
      </div>
    </header>

    <aside class="mobile-menu" data-mobile-menu>
      <div class="mobile-menu-head">
        <img src="assets/kinglike-logo-tight.png" alt="Kinglike" />
        <button class="close-btn" type="button" data-close-menu>×</button>
      </div>
      <nav aria-label="Mobile navigation">
        <a href="index.html#home">ໜ້າຫຼັກ</a>
        <a href="index.html#products">ທີ່ນອນ</a>
        <a href="collection.html?category=pillows">ໝອນ</a>
        <a href="collection.html?category=toppers">ທັອບເປີ</a>
        <a href="collection.html?category=bedding">ອຸປະກອນການນອນ</a>
      </nav>
    </aside>
    <div class="menu-backdrop" data-menu-backdrop></div>

    <main>
      <section class="product-detail-page" data-product-page></section>
    </main>

    <div class="floating-contact-group">
      <button class="floating-line whatsapp-contact" type="button" data-line-contact data-line-channel="whatsapp"><span class="contact-icon whatsapp-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12.04 3.5a8.45 8.45 0 0 0-7.27 12.75L3.8 20.5l4.36-.94a8.45 8.45 0 1 0 3.88-16.06Zm0 1.55a6.9 6.9 0 0 1 5.86 10.54 6.9 6.9 0 0 1-8.98 2.34l-.31-.18-2.44.53.54-2.38-.2-.32a6.9 6.9 0 0 1 5.53-10.53Z"/></svg></span><span>WhatsApp</span></button>
      <button class="floating-line messenger-contact" type="button" data-line-contact data-line-channel="messenger"><span class="contact-icon messenger-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3C6.76 3 2.5 6.94 2.5 11.78c0 2.76 1.38 5.22 3.54 6.82v3.05l3.24-1.78c.86.24 1.77.37 2.72.37 5.24 0 9.5-3.94 9.5-8.78S17.24 3 12 3Zm.95 11.82-2.42-2.58-4.72 2.58 5.18-5.5 2.48 2.58 4.66-2.58-5.18 5.5Z"/></svg></span><span>Messenger</span></button>
    </div>

    <aside class="drawer" data-cart-drawer>
      <div class="drawer-head">
        <h2>ລົດເຂັນ</h2>
        <button class="close-btn" type="button" data-close-cart>×</button>
      </div>
      <div class="drawer-list" data-cart-items></div>
      <div class="drawer-total">
        <span>ລວມ</span>
        <strong data-cart-total>0 ₭</strong>
      </div>
      <button class="primary-btn full-btn" type="button" data-checkout>Checkout</button>
    </aside>

    <aside class="drawer" data-wishlist-drawer>
      <div class="drawer-head">
        <h2>Wishlist</h2>
        <button class="close-btn" type="button" data-close-wishlist>×</button>
      </div>
      <div class="drawer-list" data-wishlist-items></div>
    </aside>

    <script src="product.js"></script>
  </body>
</html>
